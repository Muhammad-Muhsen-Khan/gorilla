<title>Twenty-Two Checkpoints</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#FAFAFC; --surface:#FFFFFF; --sunk:#F1F2F7;
  --ink:#171C26; --ink-2:#3D4557; --muted:#6B7286; --rule:#DFE2EB;
  --indigo:#4453A0; --indigo-soft:#EEF0FA;
  --err:#A8481A; --err-soft:#FBEFE7; --err-rule:#E8C4AB;
  --ok:#1B6E5B;
  --s1:#2a78d6; --s2:#eb6834;
  --shadow:0 1px 2px rgba(23,28,38,.05),0 8px 24px -12px rgba(23,28,38,.14);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#111419; --surface:#191D25; --sunk:#14181F;
  --ink:#E7E9EF; --ink-2:#B9BFCE; --muted:#8992A5; --rule:#2A3039;
  --indigo:#8D99E0; --indigo-soft:#1D2230;
  --err:#E39362; --err-soft:#2A1F19; --err-rule:#4A3527;
  --ok:#54BE9F;
  --s1:#3987e5; --s2:#d95926;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --ground:#111419; --surface:#191D25; --sunk:#14181F;
  --ink:#E7E9EF; --ink-2:#B9BFCE; --muted:#8992A5; --rule:#2A3039;
  --indigo:#8D99E0; --indigo-soft:#1D2230;
  --err:#E39362; --err-soft:#2A1F19; --err-rule:#4A3527;
  --ok:#54BE9F;
  --s1:#3987e5; --s2:#d95926;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);margin:0;
  font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.62;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1000px;margin:0 auto;padding:56px 28px 96px}
.lede{max-width:66ch}
h1{font-family:"IBM Plex Serif",Georgia,serif;font-weight:600;
  font-size:clamp(2rem,4.6vw,3.1rem);line-height:1.08;letter-spacing:-.022em;
  margin:0 0 .55rem;text-wrap:balance}
h2{font-size:1.34rem;font-weight:600;letter-spacing:-.012em;margin:0 0 .5rem;text-wrap:balance}
h3{font-size:1rem;font-weight:600;margin:0 0 .3rem}
p{margin:0 0 1rem;color:var(--ink-2)}
.lede p{font-size:1.07rem}
strong{color:var(--ink);font-weight:600}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:.72rem;font-weight:500;
  letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 1.1rem}
code{font-family:"IBM Plex Mono",monospace;font-size:.86em;background:var(--sunk);
  padding:.1em .34em;border-radius:3px}
section{margin-top:58px}
hr.rule{height:1px;background:var(--rule);border:0;margin:58px 0 0}
a{color:var(--indigo)}

.band{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1px;
  background:var(--rule);border:1px solid var(--rule);border-radius:10px;overflow:hidden;margin-top:32px}
.cell{background:var(--surface);padding:19px 21px}
.cell .k{font-family:"IBM Plex Mono",monospace;font-size:.68rem;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);display:block;margin-bottom:.5rem}
.cell .v{font-family:"IBM Plex Serif",Georgia,serif;font-size:1.95rem;font-weight:600;
  line-height:1;font-variant-numeric:tabular-nums;display:block}
.cell .n{font-size:.79rem;color:var(--muted);display:block;margin-top:.42rem}

.tblwrap{overflow-x:auto;border:1px solid var(--rule);border-radius:10px;
  background:var(--surface);margin-top:20px}
table{border-collapse:collapse;width:100%;font-size:.86rem;min-width:660px}
th,td{padding:9px 13px;text-align:right;border-bottom:1px solid var(--rule)}
th:first-child,td:first-child{text-align:left;white-space:nowrap}
thead th{font-family:"IBM Plex Mono",monospace;font-size:.66rem;letter-spacing:.07em;
  text-transform:uppercase;color:var(--muted);font-weight:500;background:var(--sunk);
  position:sticky;top:0}
tbody td{font-variant-numeric:tabular-nums;color:var(--ink-2)}
tbody tr:last-child td{border-bottom:0}
tbody tr.ref td{background:var(--indigo-soft);color:var(--ink);font-weight:500}
td.w{width:34%}

.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:18px;margin-top:22px}
figure{margin:0;background:var(--surface);border:1px solid var(--rule);border-radius:10px;
  padding:16px 18px 10px;box-shadow:var(--shadow);overflow:hidden}
figcaption{font-size:.82rem;color:var(--muted);margin-top:6px;line-height:1.45}
figure h3{margin-bottom:.15rem}
.chart{width:100%;height:auto;display:block;overflow:visible}
.grid{stroke:var(--rule);stroke-width:1}
.ax{font-family:"IBM Plex Mono",monospace;font-size:9.5px;fill:var(--muted)}
.axtitle{font-family:"IBM Plex Mono",monospace;font-size:9px;fill:var(--muted);
  letter-spacing:.09em;text-transform:uppercase}
.ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.pt{stroke:var(--surface);stroke-width:2}
.ln.s1{stroke:var(--s1)} .pt.s1{fill:var(--s1)}
.ln.s2{stroke:var(--s2)} .pt.s2{fill:var(--s2)}
.dlab{font-family:"IBM Plex Sans",sans-serif;font-size:11px;font-weight:600}
.dlab.s1{fill:var(--s1)} .dlab.s2{fill:var(--s2)}
.refline{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 3;opacity:.75}
.reftxt{font-family:"IBM Plex Mono",monospace;font-size:9.5px;fill:var(--muted)}
.bar{stroke:var(--surface);stroke-width:2}
.m-base{fill:var(--muted)} .m-sft{fill:var(--s1)} .m-ins{fill:var(--s2)}
.blab{font-family:"IBM Plex Mono",monospace;font-size:9px;fill:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin:2px 0 0;padding:0;list-style:none;
  font-size:.79rem;color:var(--ink-2)}
.legend li{display:flex;align-items:center;gap:6px}
.sw{width:11px;height:11px;border-radius:3px;flex:none}
.sw.a{background:var(--muted)} .sw.b{background:var(--s1)} .sw.c{background:var(--s2)}

.finds{display:grid;gap:14px;margin-top:22px}
.find{background:var(--surface);border:1px solid var(--rule);border-radius:10px;
  padding:18px 20px 18px 24px;position:relative;box-shadow:var(--shadow)}
.find::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;
  border-radius:0 3px 3px 0;background:var(--indigo)}
.find.warn::before{background:var(--err)}
.find .num{font-family:"IBM Plex Mono",monospace;font-size:.68rem;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);display:block;margin-bottom:.35rem}
.find p:last-child{margin-bottom:0}
.find p{font-size:.94rem}

.callout{border:1px solid var(--rule);border-left:3px solid var(--indigo);background:var(--surface);
  border-radius:0 9px 9px 0;padding:16px 20px;margin-top:22px}
.callout.warn{border-left-color:var(--err);background:var(--err-soft);border-color:var(--err-rule)}
.callout p:last-child{margin-bottom:0}
.formula{font-family:"IBM Plex Mono",monospace;font-size:.82rem;line-height:1.85;
  background:var(--sunk);border:1px solid var(--rule);border-radius:8px;
  padding:14px 16px;margin:16px 0;overflow-x:auto;color:var(--ink)}
.wt{display:flex;height:26px;border-radius:6px;overflow:hidden;margin:14px 0 6px;
  border:1px solid var(--rule)}
.wt span{display:flex;align-items:center;justify-content:center;
  font-family:"IBM Plex Mono",monospace;font-size:.66rem;color:#fff}
.wt .a{background:#8992A5;flex:10} .wt .b{background:#6B7286;flex:10}
.wt .c{background:#4E566B;flex:10} .wt .d{background:var(--s1);flex:30}
.wt .e{background:var(--s2);flex:40}
footer{margin-top:64px;padding-top:22px;border-top:1px solid var(--rule);
  font-size:.8rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
