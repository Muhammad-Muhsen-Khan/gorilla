<title>Reason vs No-Reason</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#FAFAFC; --surface:#FFFFFF; --sunk:#F1F2F7;
  --ink:#171C26; --ink-2:#3D4557; --muted:#6B7286; --rule:#DFE2EB; --rule-2:#EDEFF5;
  --indigo:#4453A0; --indigo-soft:#EEF0FA;
  --err:#A8481A; --err-soft:#FBEFE7; --err-rule:#E8C4AB;
  --ok:#1B6E5B; --ok-soft:#E6F2EE;
  --s1:#2a78d6; --s2:#eb6834;
  --s1-soft:#E6F0FB; --s2-soft:#FCEDE6;
  --shadow:0 1px 2px rgba(23,28,38,.05),0 8px 24px -12px rgba(23,28,38,.14);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#111419; --surface:#191D25; --sunk:#14181F;
  --ink:#E7E9EF; --ink-2:#B9BFCE; --muted:#8992A5; --rule:#2A3039; --rule-2:#222831;
  --indigo:#8D99E0; --indigo-soft:#1D2230;
  --err:#E39362; --err-soft:#2A1F19; --err-rule:#4A3527;
  --ok:#54BE9F; --ok-soft:#15251F;
  --s1:#4C93E8; --s2:#E8794B;
  --s1-soft:#16222F; --s2-soft:#2A1D16;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --ground:#111419; --surface:#191D25; --sunk:#14181F;
  --ink:#E7E9EF; --ink-2:#B9BFCE; --muted:#8992A5; --rule:#2A3039; --rule-2:#222831;
  --indigo:#8D99E0; --indigo-soft:#1D2230;
  --err:#E39362; --err-soft:#2A1F19; --err-rule:#4A3527;
  --ok:#54BE9F; --ok-soft:#15251F;
  --s1:#4C93E8; --s2:#E8794B;
  --s1-soft:#16222F; --s2-soft:#2A1D16;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);margin:0;
  font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.62;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding:56px 28px 96px}
.lede{max-width:66ch}
h1{font-family:"IBM Plex Serif",Georgia,serif;font-weight:600;
  font-size:clamp(2rem,4.6vw,3.1rem);line-height:1.08;letter-spacing:-.022em;
  margin:0 0 .55rem;text-wrap:balance}
h2{font-size:1.34rem;font-weight:600;letter-spacing:-.012em;margin:0 0 .5rem;text-wrap:balance}
h3{font-size:1rem;font-weight:600;margin:0 0 .3rem}
h4{font-size:.78rem;font-weight:600;margin:.9rem 0 .3rem;color:var(--muted);
  font-family:"IBM Plex Mono",monospace;letter-spacing:.04em}
p{margin:0 0 1rem;color:var(--ink-2)}
.lede p{font-size:1.07rem}
strong{color:var(--ink);font-weight:600}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:.72rem;font-weight:500;
  letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 1.1rem}
code{font-family:"IBM Plex Mono",monospace;font-size:.86em;background:var(--sunk);
  padding:.1em .34em;border-radius:3px}
section{margin-top:58px}
hr.rule{height:1px;background:var(--rule);border:0;margin:58px 0 0}
a{color:var(--indigo)}
:focus-visible{outline:2px solid var(--indigo);outline-offset:2px;border-radius:3px}

.band{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1px;
  background:var(--rule);border:1px solid var(--rule);border-radius:10px;overflow:hidden;margin-top:32px}
.cell{background:var(--surface);padding:19px 21px}
.cell .k{font-family:"IBM Plex Mono",monospace;font-size:.68rem;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);display:block;margin-bottom:.5rem}
.cell .v{font-family:"IBM Plex Serif",Georgia,serif;font-size:1.95rem;font-weight:600;
  line-height:1;font-variant-numeric:tabular-nums;display:block}
.cell .n{font-size:.79rem;color:var(--muted);display:block;margin-top:.42rem}

.tblwrap{overflow-x:auto;border:1px solid var(--rule);border-radius:10px;
  background:var(--surface);margin-top:20px}
table{border-collapse:collapse;width:100%;font-size:.86rem;min-width:660px}
th,td{padding:9px 13px;text-align:right;border-bottom:1px solid var(--rule)}
th:first-child,td:first-child{text-align:left;white-space:nowrap}
thead th{font-family:"IBM Plex Mono",monospace;font-size:.66rem;letter-spacing:.07em;
  text-transform:uppercase;color:var(--muted);font-weight:500;background:var(--sunk)}
tbody td{font-variant-numeric:tabular-nums;color:var(--ink-2)}
tbody tr:last-child td{border-bottom:0}
tbody tr.ref td{background:var(--indigo-soft);color:var(--ink);font-weight:500}
td.w{width:34%}

/* ---- paired head-to-head table ---- */
.cmp{min-width:820px;font-size:.84rem}
.cmp th.grp{text-align:center;border-left:1px solid var(--rule);color:var(--ink-2);
  letter-spacing:.09em}
.cmp th.ep{text-align:left;vertical-align:bottom;background:var(--sunk)}
.cmp th.sub{text-align:right;font-size:.62rem;padding-top:2px;padding-bottom:7px}
.cmp th.sub.s1{color:var(--s1)} .cmp th.sub.s2{color:var(--s2)}
.cmp th.sub:nth-of-type(odd){border-left:1px solid var(--rule)}
.cmp td.n{padding:7px 13px;font-variant-numeric:tabular-nums;color:var(--muted)}
.cmp td.n:not(.r){border-left:1px solid var(--rule)}
.cmp td.ep{font-family:"IBM Plex Mono",monospace;font-size:.76rem;color:var(--muted);
  background:var(--sunk);font-variant-numeric:tabular-nums}
.cmp td.win{color:var(--ink);font-weight:600;background:var(--s1-soft);
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--s1) 18%,transparent)}
.cmp td.r.win{background:var(--s2-soft);
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--s2) 22%,transparent)}
.cmp tr.mean td{border-top:2px solid var(--rule);font-weight:600;color:var(--ink);background:var(--sunk)}
.cmp tr.mean td.ep{font-weight:500}
.cmp tr.delta td{background:var(--sunk);border-bottom:0}
.cmp td.dl{text-align:center;font-family:"IBM Plex Mono",monospace;font-weight:600;
  color:var(--s1);font-size:.8rem;border-left:1px solid var(--rule)}
.cmp td.dl.pos{color:var(--s2)}
.cmp tr.delta td.ep{color:var(--muted);font-weight:500}

.blt td.ep{background:var(--surface);font-family:"IBM Plex Sans",sans-serif;
  font-size:.88rem;color:var(--ink);font-weight:500}
.blt td.ep .note{font-size:.75rem;color:var(--muted);font-weight:400;margin-left:9px}
.blt .dot{width:9px;height:9px;border-radius:50%;display:inline-block;
  vertical-align:middle;margin-right:9px}
.blt .b-base .dot{background:var(--muted)}
.blt .b-len  .dot{background:var(--muted);box-shadow:inset 0 0 0 2px var(--surface),0 0 0 2px var(--muted)}
.blt .b-nr   .dot{background:var(--s1)}
.blt .b-re   .dot{background:var(--s2)}
.blt .b-ins  .dot{background:var(--indigo)}
.blt td.n{color:var(--ink-2)}
.blt tr.b-ins td{background:var(--indigo-soft);color:var(--ink)}

.scorecard{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:1px;
  background:var(--rule);border:1px solid var(--rule);border-radius:10px;overflow:hidden;margin-top:24px}
.sc{background:var(--surface);padding:15px 17px}
.sc .k{font-family:"IBM Plex Mono",monospace;font-size:.63rem;letter-spacing:.09em;
  text-transform:uppercase;color:var(--muted);display:block;margin-bottom:.45rem}
.sc .pair{display:flex;align-items:baseline;gap:8px;font-variant-numeric:tabular-nums}
.sc .a{font-family:"IBM Plex Serif",Georgia,serif;font-size:1.35rem;font-weight:600;color:var(--s1)}
.sc .b{font-family:"IBM Plex Serif",Georgia,serif;font-size:1.35rem;font-weight:600;color:var(--s2)}
.sc .vs{font-size:.7rem;color:var(--muted);font-family:"IBM Plex Mono",monospace}
.sc .d{display:block;margin-top:.35rem;font-size:.75rem;color:var(--muted);
  font-family:"IBM Plex Mono",monospace}

.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:18px;margin-top:22px}
figure{margin:0;background:var(--surface);border:1px solid var(--rule);border-radius:10px;
  padding:16px 18px 10px;box-shadow:var(--shadow);overflow:hidden}
figcaption{font-size:.82rem;color:var(--muted);margin-top:6px;line-height:1.45}
figure h3{margin-bottom:.15rem}
.chart{width:100%;height:auto;display:block;overflow:visible}
.grid{stroke:var(--rule);stroke-width:1}
.ax{font-family:"IBM Plex Mono",monospace;font-size:9.5px;fill:var(--muted)}
.axtitle{font-family:"IBM Plex Mono",monospace;font-size:9px;fill:var(--muted);
  letter-spacing:.09em;text-transform:uppercase}
.ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.pt{stroke:var(--surface);stroke-width:2}
.ln.s1{stroke:var(--s1)} .pt.s1{fill:var(--s1)}
.ln.s2{stroke:var(--s2)} .pt.s2{fill:var(--s2)}
.dlab{font-family:"IBM Plex Sans",sans-serif;font-size:11px;font-weight:600}
.dlab.s1{fill:var(--s1)} .dlab.s2{fill:var(--s2)}
.refline{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 3;opacity:.75}
.reftxt{font-family:"IBM Plex Mono",monospace;font-size:9.5px;fill:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin:2px 0 0;padding:0;list-style:none;
  font-size:.79rem;color:var(--ink-2)}
.legend li{display:flex;align-items:center;gap:6px}
.sw{width:11px;height:11px;border-radius:3px;flex:none}
.sw.a{background:var(--muted)} .sw.b{background:var(--s1)} .sw.c{background:var(--s2)}
.sw.d{background:var(--indigo)}

.finds{display:grid;gap:14px;margin-top:22px}
.find{background:var(--surface);border:1px solid var(--rule);border-radius:10px;
  padding:18px 20px 18px 24px;position:relative;box-shadow:var(--shadow)}
.find::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;
  border-radius:0 3px 3px 0;background:var(--indigo)}
.find.warn::before{background:var(--err)}
.find .num{font-family:"IBM Plex Mono",monospace;font-size:.68rem;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);display:block;margin-bottom:.35rem}
.find p:last-child{margin-bottom:0}
.find p{font-size:.94rem}

.callout{border:1px solid var(--rule);border-left:3px solid var(--indigo);background:var(--surface);
  border-radius:0 9px 9px 0;padding:16px 20px;margin-top:22px}
.callout.warn{border-left-color:var(--err);background:var(--err-soft);border-color:var(--err-rule)}
.callout p:last-child{margin-bottom:0}
.formula{font-family:"IBM Plex Mono",monospace;font-size:.82rem;line-height:1.85;
  background:var(--sunk);border:1px solid var(--rule);border-radius:8px;
  padding:14px 16px;margin:16px 0;overflow-x:auto;color:var(--ink)}
.wt{display:flex;height:26px;border-radius:6px;overflow:hidden;margin:14px 0 6px;
  border:1px solid var(--rule)}
.wt span{display:flex;align-items:center;justify-content:center;
  font-family:"IBM Plex Mono",monospace;font-size:.66rem;color:#fff}
.wt .a{background:#8992A5;flex:10} .wt .b{background:#6B7286;flex:10}
.wt .c{background:#4E566B;flex:10} .wt .d{background:var(--s1);flex:30}
.wt .e{background:var(--s2);flex:40}

/* ---- transcripts ---- */
.tcard{background:var(--surface);border:1px solid var(--rule);border-radius:12px;
  box-shadow:var(--shadow);margin-top:22px;overflow:hidden}
.thead{padding:18px 22px 14px;border-bottom:1px solid var(--rule-2)}
.tid{font-family:"IBM Plex Mono",monospace;font-size:.68rem;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted);display:block;margin-bottom:.25rem}
.thead h3{margin:0 0 .2rem;font-size:1.05rem}
.tmeta{font-size:.8rem;color:var(--muted);margin:0}
.sysd{border-bottom:1px solid var(--rule-2)}
.sysd>summary,.state>summary,.think>summary{cursor:pointer;list-style:none;
  font-family:"IBM Plex Mono",monospace;font-size:.72rem;color:var(--ink-2);
  padding:10px 22px;display:flex;flex-wrap:wrap;align-items:baseline;gap:10px}
.sysd>summary::-webkit-details-marker,.state>summary::-webkit-details-marker,
.think>summary::-webkit-details-marker{display:none}
.sysd>summary::before,.state>summary::before,.think>summary::before{content:"▸";color:var(--muted)}
.sysd[open]>summary::before,.state[open]>summary::before,.think[open]>summary::before{content:"▾"}
.sysd>summary:hover,.state>summary:hover,.think>summary:hover{background:var(--sunk)}
.cnt{color:var(--muted);font-size:.68rem;font-weight:400}

.tabin{position:absolute;opacity:0;width:0;height:0;pointer-events:none}
.tabbar{display:flex;flex-wrap:wrap;gap:0;background:var(--sunk);
  border-bottom:1px solid var(--rule);padding:0 12px}
.tab{cursor:pointer;font-family:"IBM Plex Mono",monospace;font-size:.74rem;
  padding:11px 15px 10px;color:var(--muted);border-bottom:2px solid transparent;
  display:flex;align-items:center;gap:8px;user-select:none;white-space:nowrap}
.tab:hover{color:var(--ink-2)}
.tab::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.55}
.t-base::before{background:var(--muted)} .t-instruct::before{background:var(--indigo)}
.t-noreason::before{background:var(--s1)} .t-reason::before{background:var(--s2)}
.tabin:focus-visible + .tab{outline:2px solid var(--indigo);outline-offset:-2px}
.bdg{font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;
  border-radius:4px;font-weight:600}
.bdg.ok{background:var(--ok-soft);color:var(--ok)}
.bdg.no{background:var(--err-soft);color:var(--err)}
.panels{background:var(--surface)}
.panel{display:none;padding:0}
.verdict{background:var(--err-soft);border-bottom:1px solid var(--err-rule);
  padding:12px 22px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline}
.verdict .et{font-family:"IBM Plex Mono",monospace;font-size:.7rem;color:var(--err);
  font-weight:600;letter-spacing:.03em}
.verdict .em{font-size:.82rem;color:var(--ink-2)}
.convo{padding:6px 22px 22px}
.turn{padding-top:16px}
.turn + .turn{border-top:1px solid var(--rule-2);margin-top:6px}
.tno{font-family:"IBM Plex Mono",monospace;font-size:.66rem;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);margin-bottom:9px}
.step{border-left:1px solid var(--rule);padding-left:14px;margin:10px 0 10px 2px}
.sno{font-family:"IBM Plex Mono",monospace;font-size:.63rem;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);display:block;margin-bottom:6px}
.msg{display:grid;grid-template-columns:88px 1fr;gap:12px;margin:8px 0;
  border-radius:8px;padding:10px 12px;border:1px solid var(--rule-2)}
.msg .who{font-family:"IBM Plex Mono",monospace;font-size:.63rem;letter-spacing:.07em;
  text-transform:uppercase;color:var(--muted);padding-top:2px}
.mbody{min-width:0}
.m-user{background:var(--indigo-soft);border-color:color-mix(in srgb,var(--indigo) 22%,transparent)}
.m-user .who{color:var(--indigo)}
.m-assistant{background:var(--surface);border-color:var(--rule)}
.m-tool{background:var(--sunk)}
.m-err{background:var(--err-soft);border-color:var(--err-rule)}
.m-err .who{color:var(--err)}
.pl{font-family:"IBM Plex Mono",monospace;font-size:.775rem;line-height:1.6;margin:0;
  white-space:pre-wrap;word-break:break-word;color:var(--ink-2);max-height:360px;overflow:auto}
.sys-pl{max-height:440px;padding:0 22px 16px;color:var(--muted);font-size:.72rem}
.think{margin-bottom:8px;border:1px dashed var(--rule);border-radius:6px}
.think>summary{padding:6px 10px;font-size:.68rem;color:var(--muted)}
.think-pl{padding:0 10px 8px;font-style:italic;color:var(--muted);max-height:260px}
.hl{font-family:"IBM Plex Mono",monospace;font-size:.66rem;color:var(--muted);
  margin:4px 0 4px 100px;font-style:italic}
.empty{font-family:"IBM Plex Mono",monospace;font-size:.75rem;color:var(--err);margin:0}
.xtra{font-size:.8rem;color:var(--ink-2);margin:0 0 .4rem}
.state{border:1px solid var(--rule-2);border-radius:8px;margin:12px 0;background:var(--sunk)}
.state>summary{padding:8px 12px;font-size:.68rem}
.state .pl{padding:0 12px 10px;max-height:280px;font-size:.7rem}
.state h4{padding:0 12px;margin-top:8px}
@media (max-width:640px){
  .msg{grid-template-columns:1fr;gap:4px}
  .hl{margin-left:0}
}
footer{margin-top:64px;padding-top:22px;border-top:1px solid var(--rule);
  font-size:.8rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/*TABCSS*/
</style>
